
name: Tempo CI
env:
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  TEMPO_LICENSE_KEY: ""

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library:
    name: Library Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Run library tests
        run: npm test --workspace=@magmacomputing/library

  tempo:
    name: Standard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Run standard tests
        run: npm test
        working-directory: packages/tempo

  plugins:
    name: Plugin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tempo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Run plugin tests
        run: npm test --workspaces --if-present
        working-directory: packages/plugins

  functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tempo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Run functions tests
        run: npm test --workspace=@magmacomputing/tempo-fns
