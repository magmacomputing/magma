
name: Tempo CI
env:
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

on:
  push:
    branches:
      - main
      - release-c-layout-order-planner
  pull_request:
    branches:
      - main
      - release-c-layout-order-planner

jobs:
  test:
    name: Standard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}
      - name: Run standard tests
        run: npm test
        working-directory: packages/tempo


