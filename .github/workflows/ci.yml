
name: Tempo CI
env:
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  TEMPO_LICENSE_KEY: ""

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  library:
    name: Library Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Run library tests
        run: npm test --workspace=tempo-lib

  tempo:
    name: Standard Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: library
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Run standard tests
        run: npm test
        working-directory: packages/tempo

  plugins:
    name: Plugin Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tempo
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Build Core & Plugins
        run: npm run build:all
      - name: Run plugin tests
        run: npm test --if-present --workspace=@tempo-kit/plugin-snap --workspace=@tempo-kit/plugin-batch --workspace=@tempo-kit/plugin-celestial --workspace=@tempo-kit/plugin-sync --workspace=@tempo-kit/plugin-ticker --workspace=@magmacomputing/tempo-plugin-ai --workspace=@tempo-kit/plugin-roman --workspace=@tempo-kit/plugin-signals
        working-directory: packages/plugins
      - name: Typecheck plugin tests
        run: |
          for plugin in snap batch celestial sync ticker ai roman signals; do
            npx tsc --noEmit -p "$plugin/test/tsconfig.json"
          done
        working-directory: packages/plugins

  functions:
    name: Functions Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tempo
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Build Core
        run: npm run build:tempo
      - name: Run functions tests
        run: npm test --workspace=tempo-fns

  standard-tests-gate:
    name: Standard Tests
    runs-on: ubuntu-latest
    needs: [library, tempo, plugins, functions]
    if: always()
    steps:
      - name: Verify all matrix runs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more matrix test suites failed."
            exit 1
          fi
          echo "All Node matrix test suites passed successfully!"
