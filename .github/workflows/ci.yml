
name: Tempo CI
env:
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  TEMPO_LICENSE_KEY: ""

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  library:
    name: Library Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["pinned"]') || fromJSON('["22", "24", "26"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (from .node-version)
        if: matrix.node-version == 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Setup Node (${{ matrix.node-version }})
        if: matrix.node-version != 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Run library tests
        run: npm test --workspace=@magmacomputing/library

  tempo:
    name: Standard Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: library
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["pinned"]') || fromJSON('["22", "24", "26"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (from .node-version)
        if: matrix.node-version == 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Setup Node (${{ matrix.node-version }})
        if: matrix.node-version != 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Run standard tests
        run: npm test
        working-directory: packages/tempo

  plugins:
    name: Plugin Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tempo
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["pinned"]') || fromJSON('["22", "24", "26"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (from .node-version)
        if: matrix.node-version == 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Setup Node (${{ matrix.node-version }})
        if: matrix.node-version != 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Build Core
        run: npm run build:tempo
      - name: Run plugin tests
        run: npm test --if-present --workspace=@magmacomputing/tempo-plugin-snap --workspace=@magmacomputing/tempo-plugin-batch --workspace=@magmacomputing/tempo-plugin-finance --workspace=@magmacomputing/tempo-plugin-celestial --workspace=@magmacomputing/tempo-plugin-sync --workspace=@magmacomputing/tempo-plugin-ticker --workspace=@magmacomputing/tempo-plugin-ai
        working-directory: packages/plugins

  functions:
    name: Functions Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tempo
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["pinned"]') || fromJSON('["22", "24", "26"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node (from .node-version)
        if: matrix.node-version == 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Setup Node (${{ matrix.node-version }})
        if: matrix.node-version != 'pinned'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci --prefer-offline
      - name: Build Core
        run: npm run build:tempo
      - name: Run functions tests
        run: npm test --workspace=@magmacomputing/tempo-fns
