name: Sync AI Provider Manifest

on:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-providers:
    name: Scan & Sync AI Models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Query Provider Endpoints & Synchronize Manifests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run providers:sync

      - name: Verify Plugin Test Suite
        env:
          TEMPO_LICENSE_KEY: ""
        run: npm test --workspace=@magmacomputing/tempo-plugin-ai

      - name: Check for Manifest or Config Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain packages/tempo/public packages/plugins/ai/src/core/config.ts)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request for Updated Provider Manifest
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(ai): sync remote provider manifest and default models'
          title: 'chore(ai): automated weekly provider model sync'
          body: |
            ## Automated AI Provider Manifest Sync
            
            This pull request was automatically generated by the weekly **Sync AI Provider Manifest** GitHub Action workflow.
            
            ### Updated Files:
            * `packages/tempo/public/providers.v1.jsonc` (Canonical JSONC manifest)
            * `packages/tempo/public/providers.v1.json` (Compiled CDN manifest)
            * `packages/plugins/ai/src/core/config.ts` (Synchronized `DEFAULT_PROVIDERS` for offline fallback)
            
            All unit tests and provider contract assertions have been validated automatically.
          branch: automated/sync-ai-providers
          delete-branch: true
