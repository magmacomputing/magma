name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      all:
        description: '📦 Publish ALL packages'
        type: boolean
        default: false
      tempo:
        description: 'tempo (core)'
        type: boolean
        default: false
      tempo_fns:
        description: 'tempo-fns (functional utilities)'
        type: boolean
        default: false
      plugin_ai:
        description: 'tempo-plugin-ai'
        type: boolean
        default: false
      plugin_astro:
        description: 'tempo-plugin-astro'
        type: boolean
        default: false
      plugin_batch:
        description: 'tempo-plugin-batch'
        type: boolean
        default: false
      plugin_celestial:
        description: 'tempo-plugin-celestial'
        type: boolean
        default: false
      plugin_dialects:
        description: 'tempo-plugin-dialects'
        type: boolean
        default: false
      plugin_finance:
        description: 'tempo-plugin-finance'
        type: boolean
        default: false
      plugin_geo:
        description: 'tempo-plugin-geo'
        type: boolean
        default: false
      plugin_holidays:
        description: 'tempo-plugin-holidays'
        type: boolean
        default: false
      plugin_snap:
        description: 'tempo-plugin-snap'
        type: boolean
        default: false
      plugin_sync:
        description: 'tempo-plugin-sync'
        type: boolean
        default: false
      plugin_ticker:
        description: 'tempo-plugin-ticker'
        type: boolean
        default: false
      custom:
        description: '✏️ Custom packages (comma/space-separated list, e.g. "my-plugin, another-pkg")'
        required: false
        type: string
        default: ''
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve Target Packages & Build
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALL: ${{ inputs.all }}
          INPUT_TEMPO: ${{ inputs.tempo }}
          INPUT_TEMPO_FNS: ${{ inputs.tempo_fns }}
          INPUT_PLUGIN_AI: ${{ inputs.plugin_ai }}
          INPUT_PLUGIN_ASTRO: ${{ inputs.plugin_astro }}
          INPUT_PLUGIN_BATCH: ${{ inputs.plugin_batch }}
          INPUT_PLUGIN_CELESTIAL: ${{ inputs.plugin_celestial }}
          INPUT_PLUGIN_DIALECTS: ${{ inputs.plugin_dialects }}
          INPUT_PLUGIN_FINANCE: ${{ inputs.plugin_finance }}
          INPUT_PLUGIN_GEO: ${{ inputs.plugin_geo }}
          INPUT_PLUGIN_HOLIDAYS: ${{ inputs.plugin_holidays }}
          INPUT_PLUGIN_SNAP: ${{ inputs.plugin_snap }}
          INPUT_PLUGIN_SYNC: ${{ inputs.plugin_sync }}
          INPUT_PLUGIN_TICKER: ${{ inputs.plugin_ticker }}
          INPUT_CUSTOM: ${{ inputs.custom }}
        run: |
          PKGS=()

          if [ "$EVENT_NAME" = "release" ] || [ "$INPUT_ALL" = "true" ]; then
            PKGS=(
              "@magmacomputing/tempo"
              "@magmacomputing/tempo-fns"
              "@magmacomputing/tempo-plugin-astro"
              "@magmacomputing/tempo-plugin-celestial"
              "@magmacomputing/tempo-plugin-ai"
              "@magmacomputing/tempo-plugin-batch"
              "@magmacomputing/tempo-plugin-finance"
              "@magmacomputing/tempo-plugin-geo"
              "@magmacomputing/tempo-plugin-holidays"
              "@magmacomputing/tempo-plugin-snap"
              "@magmacomputing/tempo-plugin-sync"
              "@magmacomputing/tempo-plugin-ticker"
              "@magmacomputing/tempo-plugin-dialects"
            )
          else
            [ "$INPUT_TEMPO" = "true" ] && PKGS+=("@magmacomputing/tempo")
            [ "$INPUT_TEMPO_FNS" = "true" ] && PKGS+=("@magmacomputing/tempo-fns")
            [ "$INPUT_PLUGIN_AI" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-ai")
            [ "$INPUT_PLUGIN_ASTRO" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-astro")
            [ "$INPUT_PLUGIN_BATCH" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-batch")
            [ "$INPUT_PLUGIN_CELESTIAL" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-celestial")
            [ "$INPUT_PLUGIN_DIALECTS" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-dialects")
            [ "$INPUT_PLUGIN_FINANCE" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-finance")
            [ "$INPUT_PLUGIN_GEO" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-geo")
            [ "$INPUT_PLUGIN_HOLIDAYS" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-holidays")
            [ "$INPUT_PLUGIN_SNAP" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-snap")
            [ "$INPUT_PLUGIN_SYNC" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-sync")
            [ "$INPUT_PLUGIN_TICKER" = "true" ] && PKGS+=("@magmacomputing/tempo-plugin-ticker")

            if [ -n "$INPUT_CUSTOM" ]; then
              CLEAN_CUSTOM=$(echo "$INPUT_CUSTOM" | tr ',' ' ')
              for item in $CLEAN_CUSTOM; do
                [ -z "$item" ] && continue
                if [[ "$item" == @magmacomputing/* ]]; then
                  PKGS+=("$item")
                elif [ "$item" = "tempo" ]; then
                  PKGS+=("@magmacomputing/tempo")
                elif [ "$item" = "tempo-fns" ] || [ "$item" = "fns" ]; then
                  PKGS+=("@magmacomputing/tempo-fns")
                else
                  PKGS+=("@magmacomputing/tempo-plugin-$item")
                fi
              done
            fi
          fi

          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "❌ Error: No packages selected for publication. Please check at least one package or specify in the custom input."
            exit 1
          fi

          # Deduplicate package array while preserving order
          UNIQUE_PKGS=()
          for p in "${PKGS[@]}"; do
            skip=0
            for u in "${UNIQUE_PKGS[@]}"; do
              if [ "$u" = "$p" ]; then
                skip=1
                break
              fi
            done
            if [ $skip -eq 0 ]; then
              UNIQUE_PKGS+=("$p")
            fi
          done

          echo "📋 Packages queued for build & publish:"
          for p in "${UNIQUE_PKGS[@]}"; do
            echo "  • $p"
          done

          echo "TARGET_PKGS=${UNIQUE_PKGS[*]}" >> $GITHUB_ENV

          echo "🔨 Building monorepo packages..."
          npm run build:all

      - name: Publish Package(s) with Provenance
        run: |
          publish_pkg() {
            local pkg="$1"
            
            # Read exact version from workspace package.json
            local pkg_json=""
            if [ "$pkg" = "@magmacomputing/tempo" ]; then
              pkg_json="packages/tempo/package.json"
            elif [ "$pkg" = "@magmacomputing/tempo-fns" ]; then
              pkg_json="packages/functions/package.json"
            else
              local plugin_dir="${pkg#@magmacomputing/tempo-plugin-}"
              if [ -f "packages/plugins/$plugin_dir/package.json" ]; then
                pkg_json="packages/plugins/$plugin_dir/package.json"
              elif [ -f "packages/plugins/tempo-plugin-$plugin_dir/package.json" ]; then
                pkg_json="packages/plugins/tempo-plugin-$plugin_dir/package.json"
              fi
            fi

            if [ -z "$pkg_json" ] || [ ! -f "$pkg_json" ]; then
              echo "❌ Error: Could not find package.json for $pkg (searched $pkg_json)"
              exit 1
            fi

            local ver
            ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$pkg_json')).version)")

            echo "🔍 Preflight check for $pkg@$ver on npm registry..."
            
            local remote_ver=""
            local view_status=0
            remote_ver=$(npm view "$pkg@$ver" version 2>/dev/null) || view_status=$?

            if [ "$remote_ver" = "$ver" ]; then
              echo "ℹ️  $pkg@$ver is already published on npm registry. Skipping."
              return 0
            fi

            echo "📦 Publishing $pkg@$ver with provenance..."
            (cd "$(dirname "$pkg_json")" && npm publish --access public --provenance)
          }

          for pkg in $TARGET_PKGS; do
            publish_pkg "$pkg"
          done
