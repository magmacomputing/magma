<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Tempo</title>
  <!-- 
    This is the sanctioned browser import map for Tempo.
    Note: For production, you may want to bundle these or serve them from your own infrastructure.
    
    The '@js-temporal/polyfill' mapping is provided if your environment does not yet natively support Temporal.
    The '@magmacomputing/tempo/plugin-api' mapping is optional and is only required 
    if you choose to install and use Tempo Premium Plugins later.
  -->
  <script type="importmap">
  {
    "imports": {
      "@js-temporal/polyfill": "https://cdn.jsdelivr.net/npm/@js-temporal/polyfill@0/dist/index.esm.js",
      "@magmacomputing/tempo": "./node_modules/@magmacomputing/tempo/dist/tempo.index.js",
      "@magmacomputing/tempo/plugin-api": "./node_modules/@magmacomputing/tempo/dist/plugin-api.index.js"
    }
  }
  </script>
</head>

<body style="font-family: sans-serif; padding: 2rem;">
  <h1>Tempo Hello World</h1>
  <div id="output" style="padding: 1rem; background: #f0f0f0; border-radius: 8px;">
    Initializing Tempo...
  </div>

  <script type="module">
    // import '@js-temporal/polyfill'; // Uncomment if your environment lacks native Temporal support
    import { Tempo } from '@magmacomputing/tempo';

    async function bootstrap() {
      const output = document.getElementById('output');
      try {
        // Initialize the Tempo engine. 
        // This will automatically look for 'tempo.config.ts' in modern environments, 
        // or you can pass config options directly to Tempo.init() instead.
        await Tempo.bootstrap();

        const now = new Tempo();
        const formatted = now.format('{wkd}, {mon} {dd}, {yyyy} at {hh}:{mi}:{ss} {mer}');

        output.textContent = '';
        const strong = document.createElement('strong');
        strong.textContent = 'Success!';
        const br1 = document.createElement('br');
        const br2 = document.createElement('br');
        const span = document.createElement('span');
        span.style.color = 'blue';
        span.textContent = formatted;

        output.appendChild(strong);
        output.appendChild(document.createTextNode(' Tempo is initialized.'));
        output.appendChild(br1);
        output.appendChild(br2);
        output.appendChild(document.createTextNode('\n          Current Local Time: '));
        output.appendChild(span);
      } catch (err) {
        output.textContent = '';
        const strongErr = document.createElement('strong');
        strongErr.style.color = 'red';
        strongErr.textContent = 'Error initializing Tempo:';
        
        output.appendChild(strongErr);
        output.appendChild(document.createTextNode(` ${err.message}`));
        console.error(err);
      }
    }

    bootstrap();
  </script>
</body>

</html>
